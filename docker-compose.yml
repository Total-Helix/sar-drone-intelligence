version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: sar_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sar_agent
    volumes:
      - sar_mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/sar_agent --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: sar_phoenix
    ports:
      - "6006:6006" # Phoenix UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: sar_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - sar_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: sar_backend
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      phoenix:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sar_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sar_mongo_data:
    driver: local
  sar_es_data:
    driver: local

networks:
  default:
    name: sar_network
